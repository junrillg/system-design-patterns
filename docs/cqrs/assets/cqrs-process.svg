<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1450" viewBox="0 0 760 1450" role="img" aria-labelledby="title desc">
<title id="title">CQRS: document approval and onboarding summary</title>
<desc id="desc">A command handler commits authoritative state and an outbox event together. A background worker refreshes a versioned read view with retries. The query handler reads that view, which can lag behind the successful approval.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#24405e"/></marker></defs>
<rect width="760" height="1450" fill="#ffffff"/>
<style>text{font-family:DejaVu Sans,sans-serif;fill:#172d48} .h{font-size:30px;font-weight:700} .t{font-size:25px} .s{font-size:22px} .line{fill:none;stroke:#24405e;stroke-width:3;marker-end:url(#arrow)}</style>
<text x="36" y="48" class="h">CQRS · onboarding document approval</text><text x="36" y="86" class="s">Design scenario · asynchronous projection</text><rect x="36" y="112" width="30" height="22" rx="16" fill="#EAF2FF" stroke="#24405e" stroke-width="2"/><text x="78" y="131" class="s">Application code</text><rect x="350" y="112" width="30" height="22" rx="16" fill="#E7F5EC" stroke="#24405e" stroke-width="2"/><text x="392" y="131" class="s">Stored data</text><rect x="36" y="164" width="624" height="164" rx="16" fill="#EAF2FF" stroke="#24405e" stroke-width="2"/><text x="60" y="204" class="h">1  Approve document</text><text x="60" y="242" class="t">Command handler · write model</text><text x="60" y="277" class="t">Check permission, rules and version</text><text x="60" y="309" class="s">Reject conflicting edits before committing</text><path d="M348 328 V372" class="line"/><rect x="36" y="376" width="624" height="198" rx="16" fill="#E7F5EC" stroke="#24405e" stroke-width="2" stroke-dasharray="8 5"/><text x="60" y="416" class="h">One local transaction</text><text x="60" y="455" class="t">Authoritative record: Approved · v12</text><text x="60" y="494" class="t">Outbox event: full summary snapshot</text><text x="60" y="533" class="t">Commit both, then return success</text><text x="60" y="560" class="s">Saved response includes version 12</text><path d="M348 574 V638" class="line"/><text x="370" y="613" class="s">Committed events only</text><rect x="36" y="642" width="624" height="200" rx="16" fill="#EAF2FF" stroke="#24405e" stroke-width="2"/><text x="60" y="683" class="h">2  Update dashboard</text><text x="60" y="722" class="t">Background worker · relay + projector</text><text x="60" y="761" class="t">Apply only a newer full snapshot</text><text x="60" y="797" class="s">Acknowledge after the read-store commit</text><text x="60" y="827" class="s">Failure: retain event for retry and recovery</text><path d="M660 786 H712 V690 H665" class="line"/><text x="675" y="669" class="s">Retry</text><path d="M348 842 V912" class="line"/><text x="370" y="884" class="s">Separate local commit</text><rect x="36" y="916" width="624" height="135" rx="16" fill="#E7F5EC" stroke="#24405e" stroke-width="2"/><text x="60" y="958" class="h">Saved read view · projection</text><text x="60" y="997" class="t">Employee 7 · Document: Approved</text><text x="60" y="1031" class="t">Summary version: 12</text><path d="M348 1051 V1117" class="line"/><text x="370" y="1092" class="s">Read the summary</text><rect x="36" y="1121" width="624" height="139" rx="16" fill="#EAF2FF" stroke="#24405e" stroke-width="2"/><text x="60" y="1162" class="h">3  Read status</text><text x="60" y="1202" class="t">Query handler · read model</text><text x="60" y="1236" class="s">Authorize scope; return display fields</text><rect x="36" y="1294" width="688" height="116" rx="16" fill="#F1F4F8" stroke="#24405e" stroke-width="2"/><text x="60" y="1333" class="s">Approval saved does not mean view refreshed</text><text x="60" y="1366" class="s">Until step 2 commits, step 3 can show v11.</text><text x="60" y="1395" class="s">Later commands recheck authoritative state.</text></svg>